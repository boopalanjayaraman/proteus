<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Northwind Pay — Settlement Console</title>
  <style>
    :root { --bg:#0f1115; --sur:#161a21; --line:#242a33; --fg:#e6e9ef;
            --fg2:#96a0b0; --acc:#58d1cd; --ok:#7fd08c; --bad:#e88b7d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
           font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
           display:flex; align-items:center; justify-content:center; padding:32px; }
    .card { width:100%; max-width:640px; background:var(--sur);
            border:1px solid var(--line); border-radius:14px; padding:28px 30px; }
    h1 { margin:0 0 4px; font-size:19px; letter-spacing:-0.01em; }
    .sub { color:var(--fg2); font-size:13px; margin-bottom:24px; }
    .crypto { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
    .box { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
    .lbl { font-size:10.5px; letter-spacing:.09em; color:var(--fg2); text-transform:uppercase; }
    .val { font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace; margin-top:5px; color:var(--acc); }
    .val.sig { color:var(--fg); }
    form { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; }
    label { font-size:11px; color:var(--fg2); display:block; margin-bottom:5px; }
    input { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--fg);
            border-radius:8px; padding:9px 11px; font:14px inherit; }
    button { background:var(--acc); color:#04211f; border:0; border-radius:8px;
             padding:10px 18px; font:600 14px inherit; cursor:pointer; }
    pre { margin:20px 0 0; background:var(--bg); border:1px solid var(--line);
          border-radius:10px; padding:14px 16px; font:12.5px ui-monospace,Menlo,monospace;
          color:var(--fg2); white-space:pre-wrap; min-height:22px; }
    .foot { margin-top:18px; font-size:11px; color:var(--fg2); letter-spacing:.05em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Northwind Pay · Settlement Console</h1>
    <div class="sub">B2B settlement exchange with the acquiring bank.</div>

    <div class="crypto">
      <div class="box">
        <div class="lbl">Key establishment</div>
        <div class="val" id="kex" th:text="${keyEstablishment}">—</div>
      </div>
      <div class="box">
        <div class="lbl">Advice signature</div>
        <div class="val sig" th:text="${signatureAlgorithm}">—</div>
      </div>
    </div>

    <form onsubmit="return submitSettlement(event)">
      <div>
        <label for="merchant">Merchant</label>
        <input id="merchant" value="NWP-88213">
      </div>
      <div>
        <label for="amount">Amount (minor)</label>
        <input id="amount" value="149900">
      </div>
      <button type="submit">Settle</button>
    </form>

    <pre id="out">Awaiting settlement…</pre>
    <div class="foot">SESSION KEY TRANSPORTED TO ACQUIRER · ADVICE SIGNED SEPARATELY</div>
  </div>

  <script>
    async function submitSettlement(e) {
      e.preventDefault();
      const out = document.getElementById('out');
      out.textContent = 'Settling…';
      try {
        const res = await fetch('/settlements', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            merchantId: document.getElementById('merchant').value,
            currency: 'GBP',
            amountMinor: Number(document.getElementById('amount').value)
          })
        });
        const body = await res.json();
        out.textContent = res.status + ' ' + JSON.stringify(body, null, 2);
        if (body.keyEstablishment) document.getElementById('kex').textContent = body.keyEstablishment;
      } catch (err) {
        out.textContent = 'Failed: ' + err.message;
      }
      return false;
    }
  </script>
</body>
</html>
