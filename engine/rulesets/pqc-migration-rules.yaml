# ---------------------------------------------------------------------------
# Cross-document prohibitions
# ---------------------------------------------------------------------------

  - ruleId: PROHIB-001
    family: PROHIBITION
    title: A signature usage must not be migrated to a KEM
    authority: NORMATIVE_FINAL
    evidenceClass: INFERRED
    normativeStrength: SHALL_NOT
    confidence: 0.9
    machineEvaluable: true
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^(RSA|ECDSA|EdDSA|DSA)"
      usageIn: [DIGITAL_SIGNATURE, CERTIFICATE_VALIDATION]
    then:
      prohibits: MIGRATE_TO_KEM
      engineBehaviour: SUPPRESS_PLAN_ITEM
      reason: >-
        A KEM establishes a shared secret key and is not a signature scheme. An RSA signature
        usage is out of scope for an ML-KEM migration and must be reported separately.
    prohibitedActions: [REPLACE_ALGORITHM, MODIFY_SOURCE]
    quote: "A KEM is a particular type of key establishment scheme."
    source: {document: NIST.FIPS.203.pdf, section: "1.1", page: 10}
    supersedes: []
    notes: >-
      INFERRED, therefore NON-GATING despite a Tier A source. No document in this corpus
      states the prohibition directly; it is derived from FIPS203-1.1-003 (a KEM is a key
      establishment scheme) combined with SP1800-38B-3.2.3-001 (RSA Signature and RSA
      Encryption are separate entries with separate specifications). This is the single most
      important prohibition in the product and it deserves a direct citation — FIPS 204 or
      SP 800-131A would likely supply one. Logged in requires-source.md.

  - ruleId: PROHIB-002
    family: PROHIBITION
    title: Protocol-managed cryptography must not be rewritten in application code
    authority: INFORMATIVE
    evidenceClass: INFERRED
    normativeStrength: SHALL_NOT
    confidence: 0.75
    machineEvaluable: true
    gating: false
    inDemoScope: true
    when:
      protocolManaged: true
    then:
      prohibits: UNILATERAL_PROTOCOL_CHANGE
      engineBehaviour: RAISE_GATE
      reason: >-
        Cryptography negotiated by a protocol stack is a bilateral contract with the peer.
        Changing it from one side breaks interoperability.
    prohibitedActions: [REPLACE_ALGORITHM, MODIFY_SOURCE, REMOVE_LEGACY_ALGORITHM]
    quote: "Modern network security protocols tend to use separate asymmetric keys for key establishment and authentication."
    source: {document: NIST.IR.8547.ipd.pdf, section: "3.1.3", page: 15}
    supersedes: []
    notes: >-
      INFERRED from a DRAFT source — non-gating on both counts. IR 8547 §3.2 supports the
      interoperability concern ("quantum-vulnerable and quantum-resistant cryptographic
      algorithms will be fielded and used alongside each other in many applications and
      systems during the transition to PQC to facilitate interoperability") but states no
      prohibition. Logged in requires-source.md.

  - ruleId: PROHIB-003
    family: PROHIBITION
    title: Existing RSA or ECC key material must not be reused as ML-KEM key material
    authority: NORMATIVE_FINAL
    evidenceClass: INFERRED
    normativeStrength: SHALL_NOT
    confidence: 0.85
    machineEvaluable: false
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      prohibits: REUSE_CLASSICAL_KEY_MATERIAL
      engineBehaviour: RAISE_GATE
      reason: >-
        ML-KEM encapsulation and decapsulation keys are structurally distinct from RSA and
        ECC keys and must be generated by ML-KEM.KeyGen.
    prohibitedActions: [REUSE_EXISTING_KEY_MATERIAL]
    quote: "A KEM involves three different types of keys: encapsulation keys, decapsulation keys, and shared secret keys."
    source: {document: NIST.FIPS.203.pdf, section: "3.2", page: 24}
    supersedes: []
    notes: >-
      INFERRED, non-gating. FIPS 203 §8 Table 3 fixes ML-KEM-768 key sizes at 1184 and 2400
      bytes, which no RSA key satisfies, and §3.3 requires keys to come from KeyGen using an
      approved RBG — but the corpus states no explicit prohibition on reuse. Practically
      unreachable as a bug (the sizes would not parse), which is why confidence is high and
      gating is still false. NOTE: GENERATE_KEY is deliberately NOT prohibited here. ML-KEM
      keys must come from ML-KEM.KeyGen, so forbidding key generation would forbid the
      correct migration; only reuse of classical key material is prohibited.
