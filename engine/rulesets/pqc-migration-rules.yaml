# PQC Migration Rules — standards-derived
#
# Extracted from the documents in knowledge/ per engine/prompts/ruleset_extraction_prompt_v2.md
# Every rule traces to a verbatim quotation from a named standard.
#
# authority   NORMATIVE_FINAL | NORMATIVE_DRAFT | INFORMATIVE   — what the DOCUMENT is
# evidence    OBSERVED | INFERRED                                — whether the rule was derived
# gating      true only when authority=NORMATIVE_FINAL AND evidence=OBSERVED
#
# Companion file: migration-execution-rules.yaml (how the agent acts on these).

schemaVersion: 1

corpus:
  - document: NIST.FIPS.203.pdf
    title: Module-Lattice-Based Key-Encapsulation Mechanism Standard
    pages: 56
    publisher: NIST
    status: Final, August 2024
    authority: NORMATIVE_FINAL
    tier: A
  - document: NIST.SP.800-227.pdf
    title: Recommendations for Key-Encapsulation Mechanisms
    pages: 64
    publisher: NIST
    status: Final, September 2025
    authority: NORMATIVE_FINAL
    tier: A
  - document: NIST.IR.8547.ipd.pdf
    title: Transition to Post-Quantum Cryptography Standards
    pages: 29
    publisher: NIST
    status: Initial Public Draft, November 2024
    authority: NORMATIVE_DRAFT
    tier: B
  - document: pqc-migration-nist-sp-1800-38b-preliminary-draft.pdf
    title: "Quantum Readiness: Cryptographic Discovery, Volume B"
    pages: 68
    publisher: NIST NCCoE
    status: Preliminary Draft
    authority: INFORMATIVE
    tier: C
  - document: Strategy-for-Migrating-to-Automated-PQC-Discovery-and-Inventory-Tools.pdf
    title: Strategy for Migrating to Automated PQC Discovery and Inventory Tools
    pages: 10
    publisher: CISA
    status: August 2024
    authority: INFORMATIVE
    tier: C

rules:

# ---------------------------------------------------------------------------
# FIPS 203 — Tier A, normative final
# ---------------------------------------------------------------------------

  - ruleId: FIPS203-1.1-001
    family: ALGORITHM_CLASSIFICATION
    title: SP 800-56A and SP 800-56B key-establishment schemes are quantum-vulnerable
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: STATEMENT
    confidence: 1.0
    machineEvaluable: true
    gating: true
    inDemoScope: true
    when:
      algorithmMatches: "^(RSA|DH|ECDH|MQV)($|[-_])"
      usageIn: [KEY_ESTABLISHMENT, KEY_TRANSPORT]
    then:
      quantumVulnerable: true
      severity: CRITICAL
      impact: MIGRATION_REQUIRED
    prohibitedActions: []
    quote: "The key establishment schemes specified in SP 800-56A and SP 800-56B are vulnerable to attacks that use sufficiently-capable quantum computers."
    source: {document: NIST.FIPS.203.pdf, section: "1.1", page: 10}
    supersedes: []
    notes: >-
      SP 800-56B is the RSA key-establishment (key transport) recommendation; SP 800-56A
      covers finite-field and elliptic-curve Diffie-Hellman and MQV. This is link (a) of the
      reference-scenario chain.

  - ruleId: FIPS203-1.1-002
    family: MIGRATION_TARGET
    title: ML-KEM is the approved quantum-resistant alternative for key establishment
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: STATEMENT
    confidence: 1.0
    machineEvaluable: true
    gating: true
    inDemoScope: true
    when:
      algorithmMatches: "^(RSA|DH|ECDH|MQV)($|[-_])"
      usageIn: [KEY_ESTABLISHMENT, KEY_TRANSPORT]
    then:
      target: ML-KEM
      targetFamily: KEM
      requiresParameterSelection: true
    prohibitedActions: []
    quote: "ML-KEM is an approved alternative that is presently believed to be secure, even against adversaries in possession of a large-scale fault-tolerant quantum computer."
    source: {document: NIST.FIPS.203.pdf, section: "1.1", page: 10}
    supersedes: []
    notes: Link (b) of the reference-scenario chain.

  - ruleId: FIPS203-1.1-003
    family: USAGE_CLASSIFICATION
    title: A KEM is a key-establishment scheme and nothing else
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: STATEMENT
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: true
    when: {}
    then:
      impliesUsage: KEY_ESTABLISHMENT
      strength: STRONG
    prohibitedActions: []
    quote: "A key-encapsulation mechanism (KEM) is a set of algorithms that can be used to establish a shared secret key between two parties communicating over a public channel. A KEM is a particular type of key establishment scheme."
    source: {document: NIST.FIPS.203.pdf, section: "1.1", page: 10}
    supersedes: []
    notes: >-
      A scope definition, not an evaluable predicate — it constrains what a KEM target may
      be selected for. It is the primary support for PROHIB-001.

  - ruleId: FIPS203-3.2-001
    family: PARAMETER_SELECTION
    title: ML-KEM has exactly three approved parameter sets
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: STATEMENT
    confidence: 1.0
    machineEvaluable: true
    gating: true
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      approvedParameterSets:
        - {parameterSet: ML-KEM-512, securityCategory: 1}
        - {parameterSet: ML-KEM-768, securityCategory: 3}
        - {parameterSet: ML-KEM-1024, securityCategory: 5}
      rejectIfNotListed: true
    prohibitedActions: []
    quote: "ML-KEM-512 is claimed to be in security category 1, ML-KEM-768 is claimed to be in security category 3, and ML-KEM-1024 is claimed to be in security category 5."
    source: {document: NIST.FIPS.203.pdf, section: "8", page: 49}
    supersedes: [IR8547-4.1.2-004]
    notes: >-
      Enumeration only — it establishes the closed set of approved parameter sets and
      rejects anything outside it. Selecting among them is FIPS203-8-001's job; an
      enumeration rule that also picked a default would conflate "approved" with "chosen".
      Authoritative over IR 8547 Table 5, which names the two larger parameter sets
      "ML-DSA-768" and "ML-DSA-1024" inside a table of ML-KEM key-establishment schemes.

  - ruleId: FIPS203-8-001
    family: PARAMETER_SELECTION
    title: ML-KEM-768 is the recommended default parameter set
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHOULD
    confidence: 1.0
    machineEvaluable: true
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      parameterSet: ML-KEM-768
      securityCategory: 3
    prohibitedActions: []
    quote: "NIST recommends using ML-KEM-768 as the default parameter set, as it provides a large security margin at a reasonable performance cost."
    source: {document: NIST.FIPS.203.pdf, section: "8", page: 49}
    supersedes: []
    notes: >-
      Link (c) of the reference-scenario chain. A recommendation, not a requirement — it
      informs target selection but must not fail verification, hence gating false.

  - ruleId: FIPS203-8-002
    family: PARAMETER_SELECTION
    title: Prefer the strongest practical parameter set when first establishing protection
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHOULD
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: false
    when: {}
    then:
      parameterSet: ML-KEM-1024
      securityCategory: 5
    prohibitedActions: []
    quote: "When initially establishing cryptographic protections for data, the strongest possible parameter set should be used."
    source: {document: NIST.FIPS.203.pdf, section: "8", page: 49}
    supersedes: []
    notes: >-
      Not machine-evaluable: "possible" depends on performance budget and payload-size
      tolerance, neither of which the engine observes. Sits in tension with FIPS203-8-001;
      both are SHOULD, and the document states both, so neither supersedes the other.

  - ruleId: FIPS203-8-003
    family: VERIFICATION_ASSERTION
    title: ML-KEM-768 key, ciphertext and shared-secret sizes are fixed
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: STATEMENT
    confidence: 1.0
    machineEvaluable: true
    gating: true
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM-768$"
    then:
      check: REQUIRED_PQC_PRESENT
      assertion: PRESENT
      patterns: ["1184", "2400", "1088", "32"]
    prohibitedActions: []
    quote: "Table 3. Sizes (in bytes) of keys and ciphertexts of ML-KEM"
    source: {document: NIST.FIPS.203.pdf, section: "8", page: 48}
    supersedes: []
    notes: >-
      Table 3, ML-KEM-768 row: encapsulation key 1184 bytes, decapsulation key 2400,
      ciphertext 1088, shared secret key 32. The quote is the table caption because table
      rows do not extract as contiguous text; the values are read directly from that table
      and are therefore OBSERVED. Drives generated size assertions — see EXEC-TEST-003.

  - ruleId: FIPS203-3.3-001
    family: PROHIBITION
    title: K-PKE is not approved as a stand-alone public-key encryption scheme
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL_NOT
    confidence: 1.0
    machineEvaluable: true
    gating: true
    inDemoScope: true
    when:
      algorithmMatches: "^(ML-KEM|K-PKE)"
      usageIn: [SYMMETRIC_ENCRYPTION]
    then:
      prohibits: USE_KEM_AS_GENERAL_ENCRYPTION
      engineBehaviour: SUPPRESS_PLAN_ITEM
      reason: >-
        ML-KEM's internal public-key encryption component is not approved for stand-alone
        use, so an ML-KEM migration cannot be proposed as a replacement for arbitrary-message
        encryption.
    prohibitedActions: [REPLACE_ALGORITHM, MODIFY_SOURCE]
    quote: "The public-key encryption scheme K-PKE described in Section 5 shall not be used as a stand-alone cryptographic scheme."
    source: {document: NIST.FIPS.203.pdf, section: "3.3", page: 24}
    supersedes: []
    notes: >-
      FIPS 203 §3.3 continues: the K-PKE algorithms "are not approved for use as a public-key
      encryption scheme."

  - ruleId: FIPS203-3.3-002
    family: USAGE_CONSTRAINT
    title: The ML-KEM shared secret key is directly usable; further derivation must be approved
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL
    confidence: 1.0
    machineEvaluable: true
    gating: true
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: DERIVED_KEYS_SHALL_USE_APPROVED_KDM
      verifiableBy: REQUIRED_PATTERN
      patterns: ["HKDF", "SP800-?108", "SP800-?56C", "KDF", "deriveKey"]
    prohibitedActions: []
    quote: "If further key derivation is needed, the final symmetric keys shall be derived from this 256-bit shared secret key in an approved manner, as specified in SP 800-108 and SP 800-56C"
    source: {document: NIST.FIPS.203.pdf, section: "3.3", page: 25}
    supersedes: []
    notes: >-
      Link (d) of the reference-scenario chain. Note the conditional: the 256-bit shared
      secret "can be used directly as a shared secret key for symmetric cryptography". A rule
      demanding a KDF unconditionally would be wrong. The required pattern applies only where
      derivation is actually performed.

  - ruleId: FIPS203-3.3-003
    family: USAGE_CONSTRAINT
    title: ML-KEM-768 requires an approved RBG of at least 192-bit security strength
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL
    confidence: 1.0
    machineEvaluable: true
    gating: true
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM-768$"
    then:
      requirement: APPROVED_RBG_MIN_192_BITS
      verifiableBy: REQUIRED_PATTERN
      patterns: ["SecureRandom", "DRBG", "getInstanceStrong"]
    prohibitedActions: []
    quote: "these random bytes shall be generated using an approved RBG, as prescribed in SP 800-90A, SP 800-90B, and SP 800-90C"
    source: {document: NIST.FIPS.203.pdf, section: "3.3", page: 25}
    supersedes: []
    notes: >-
      The same paragraph sets the per-parameter-set floor: "at least 128 bits for ML-KEM-512,
      at least 192 bits for ML-KEM-768, and at least 256 bits for ML-KEM-1024." The patterns
      are Java-specific and only evidence that *some* RBG is used; they cannot establish that
      it is approved or correctly strengthed. Treat a pattern miss as a finding, not a pass.

  - ruleId: FIPS203-3.3-004
    family: USAGE_CONSTRAINT
    title: Encaps and Decaps inputs must be checked
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: INPUT_CHECKING_REQUIRED
      verifiableBy: GENERATED_TEST
      patterns: []
    prohibitedActions: []
    quote: "Implementers shall ensure that ML-KEM.Encaps and ML-KEM.Decaps are only executed on inputs that have been checked, as described in Section 7."
    source: {document: NIST.FIPS.203.pdf, section: "3.3", page: 25}
    supersedes: []
    notes: >-
      Not statically evaluable — whether checking occurred is a property of the provider
      implementation, not of the calling code. Verified behaviourally instead: see
      EXEC-TEST-004, which generates a malformed-key rejection test.

  - ruleId: FIPS203-3.3-005
    family: USAGE_CONSTRAINT
    title: Intermediate values must be destroyed before the algorithm terminates
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: false
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: DESTROY_INTERMEDIATE_VALUES
      verifiableBy: MANUAL_REVIEW
      patterns: []
    prohibitedActions: []
    quote: "implementers shall ensure that intermediate data is destroyed as soon as it is no longer needed"
    source: {document: NIST.FIPS.203.pdf, section: "3.3", page: 25}
    supersedes: []
    notes: >-
      A property of the cryptographic module, not of application code. In the reference
      scenario the application calls a validated provider and does not implement ML-KEM, so
      this constrains provider selection rather than the migration diff. SP 800-227 §3.2
      (RS5) states the same requirement for KEMs generally; not duplicated as its own rule.

  - ruleId: FIPS203-3.3-006
    family: USAGE_CONSTRAINT
    title: ML-KEM implementations must not use floating-point arithmetic
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL_NOT
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: false
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: NO_FLOATING_POINT
      verifiableBy: MANUAL_REVIEW
      patterns: []
    prohibitedActions: []
    quote: "Implementations of ML-KEM shall not use floating-point arithmetic, as rounding errors in floating-point operations may lead to incorrect results in some cases."
    source: {document: NIST.FIPS.203.pdf, section: "3.3", page: 26}
    supersedes: []
    notes: >-
      Applies to implementers of the primitive. Retained because it distinguishes "use a
      validated provider" from "write your own ML-KEM", which is a migration decision the
      agent could otherwise make silently.

# ---------------------------------------------------------------------------
# SP 800-227 — Tier A, normative final
# ---------------------------------------------------------------------------

  - ruleId: SP800-227-1.3-001
    family: USAGE_CONSTRAINT
    title: A conforming ML-KEM implementation must comply with FIPS 203
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL
    confidence: 1.0
    machineEvaluable: true
    gating: true
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: RS1_COMPLY_WITH_FIPS_203
      verifiableBy: DEPENDENCY_CHECK
      patterns: []
    prohibitedActions: []
    quote: "KEM implementations shall comply with a specific NIST FIPS or SP that specifies the algorithms of the relevant KEM. For example, a conforming implementation of ML-KEM shall comply with FIPS 203"
    source: {document: NIST.SP.800-227.pdf, section: "1.3 (RS1)", page: 10}
    supersedes: []
    notes: >-
      Verified by establishing that the selected provider version implements FIPS 203
      ML-KEM, not by scanning application source. Drives the dependency-upgrade plan item.

  - ruleId: SP800-227-1.3-002
    family: USAGE_CONSTRAINT
    title: KEM implementations must use approved components meeting the parameter set's strength
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: RS3_APPROVED_COMPONENTS_MEET_STRENGTH
      verifiableBy: MANUAL_REVIEW
      patterns: []
    prohibitedActions: []
    quote: "KEM implementations shall use approved components with security strengths that meet or exceed the required strength for each KEM parameter set."
    source: {document: NIST.SP.800-227.pdf, section: "1.3 (RS3)", page: 10}
    supersedes: []
    notes: >-
      Requires knowing the approval status of every hash and RBG the provider composes,
      which the engine cannot observe from the repository.

  - ruleId: SP800-227-1.3-003
    family: USAGE_CONSTRAINT
    title: Ephemeral KEM key pairs must be used once and destroyed
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
      keyLifecycle: EPHEMERAL
    then:
      requirement: RS6_EPHEMERAL_KEYPAIR_SINGLE_USE
      verifiableBy: GENERATED_TEST
      patterns: []
    prohibitedActions: [REUSE_EXISTING_KEY_MATERIAL]
    quote: "If an application uses an ephemeral key pair, the key pair shall be used for only one execution of key-establishment via a KEM and shall be destroyed as soon as possible after its use."
    source: {document: NIST.SP.800-227.pdf, section: "1.3 (RS6)", page: 10}
    supersedes: []
    notes: >-
      Conditional by its own terms: the requirement applies only where the application uses
      an ephemeral key pair, so `keyLifecycle` must be established before it fires. Applying
      it to every ML-KEM use would forbid the legitimate static-key case the same section
      goes on to describe. Whether a key pair is ephemeral is a property of application
      design the engine cannot determine statically, hence machineEvaluable false.

  - ruleId: SP800-227-1.3-004
    family: USAGE_CONSTRAINT
    title: A parameter set with application-appropriate security strength must be selected
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: RM2_APPLICATION_APPROPRIATE_STRENGTH
      verifiableBy: HUMAN_DECISION
      patterns: []
    prohibitedActions: []
    quote: "In applications of KEMs, a parameter set with an application-appropriate security strength must be selected"
    source: {document: NIST.SP.800-227.pdf, section: "1.3 (RM2)", page: 11}
    supersedes: []
    notes: >-
      "Application-appropriate" needs protection lifetime and data sensitivity, neither of
      which the engine holds unless the user supplied them in project instructions. This is
      why FIPS203-8-001's default recommendation carries the selection in practice — and why
      that selection is reported rather than asserted. See gaps.md.

  - ruleId: SP800-227-1.3-005
    family: USAGE_CONSTRAINT
    title: Ownership assurance is required before using another party's static encapsulation key
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHALL
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: RM3_STATIC_KEY_OWNERSHIP_ASSURANCE
      verifiableBy: MANUAL_REVIEW
      patterns: []
    prohibitedActions: []
    quote: "If an encapsulating party obtains the static encapsulation key of another party, it must have assurance of the other party's ownership of the key before or during the execution of key-establishment."
    source: {document: NIST.SP.800-227.pdf, section: "1.3 (RM3)", page: 11}
    supersedes: []
    notes: >-
      Directly relevant where a migration replaces an RSA key transport whose peer key
      arrived with certificate-backed ownership assurance: that assurance must not be lost
      in the substitution. Not statically checkable; raise as a review item on any plan
      touching partner key exchange.

  - ruleId: FIPS203-3.2-002
    family: USAGE_CONSTRAINT
    title: A tampered valid-length ciphertext is implicitly rejected, not signalled as an error
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: STATEMENT
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: IMPLICIT_REJECTION_YIELDS_DIFFERENT_SECRET_NOT_AN_ERROR
      verifiableBy: GENERATED_TEST
      patterns: []
    prohibitedActions: []
    quote: "In either case, decapsulation outputs the resulting shared secret key"
    source: {document: NIST.FIPS.203.pdf, section: "3.2", page: 42}
    supersedes: []
    notes: >-
      Decisive for test generation, and easy to get wrong in a way that fails against a
      CORRECT implementation. Two different behaviours must not be conflated:
      a ciphertext of the wrong LENGTH fails the §7.3 input check (FIPS203-3.3-004), whereas
      a tampered ciphertext of the RIGHT length passes input checking, is decapsulated, and
      returns a pseudorandom shared secret with no exception raised — "In either case,
      decapsulation outputs the resulting shared secret key". The correct assertion for
      tampering is therefore that the decapsulated secret DIFFERS from the encapsulated one,
      never that a call throws. Drives EXEC-TEST-004.

  - ruleId: SP800-227-4.2-001
    family: USAGE_CONSTRAINT
    title: IND-CCA-secure KEMs should be used wherever possible
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHOULD
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: true
    when: {}
    then:
      requirement: PREFER_IND_CCA
      verifiableBy: MANUAL_REVIEW
      patterns: []
    prohibitedActions: []
    quote: "Whenever possible, IND-CCA-secure KEMs should be used. For some specific applications (e.g., ephemeral key establishment), IND-CPA security might be sufficient."
    source: {document: NIST.SP.800-227.pdf, section: "4.2", page: 25}
    supersedes: []
    notes: >-
      ML-KEM is IND-CCA2 per FIPS 203 §3.2, so a straightforward ML-KEM migration satisfies
      this. It becomes live only if a composite or hybrid construction is proposed.

  - ruleId: SP800-227-4.2-002
    family: USAGE_CONSTRAINT
    title: Shared secret and derived keys must be used only with appropriately secure symmetric algorithms
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: SHOULD
    confidence: 1.0
    machineEvaluable: false
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: SYMMETRIC_STRENGTH_APPROPRIATE_FOR_APPLICATION
      verifiableBy: MANUAL_REVIEW
      patterns: []
    prohibitedActions: []
    quote: "The KEM shared secret key and any derived keys should only be used with appropriately secure symmetric-key cryptographic algorithms."
    source: {document: NIST.SP.800-227.pdf, section: "4.2", page: 27}
    supersedes: []
    notes: >-
      "Appropriately secure" is defined by the application's desired security properties,
      not by a fixed allow-list. An earlier draft of this rule required AES-192 or above and
      would have flagged ML-KEM-768 paired with AES-128 — a legitimate configuration where
      the application targets 128-bit security. The source says only that the symmetric
      strength should be "appropriate for the security provided by the KEM", which the engine
      cannot evaluate without the application's target strength. Reported, never asserted.

  - ruleId: SP800-227-4.3-001
    family: USAGE_CONSTRAINT
    title: A KEM outputs a key that is ready to use; derivation is conditional and must be approved
    authority: NORMATIVE_FINAL
    evidenceClass: OBSERVED
    normativeStrength: MAY
    confidence: 1.0
    machineEvaluable: true
    gating: false
    inDemoScope: true
    when:
      algorithmMatches: "^ML-KEM"
    then:
      requirement: KDM_ONLY_WHEN_LENGTH_MISMATCHED
      verifiableBy: REQUIRED_PATTERN
      patterns: ["SP800-?108", "SP800-?56C", "SP800-?133", "HKDF"]
    prohibitedActions: []
    quote: "In contrast, KEMs by definition output a key K that is ready to use."
    source: {document: NIST.SP.800-227.pdf, section: "4.3", page: 27}
    supersedes: []
    notes: >-
      The section continues that where derivation IS needed, the shared secret key "may be
      used as a key-derivation key supplied to an approved key-derivation method specified in
      SP 800-108, SP 800-56C, or SP 800-133". This is the rule that stops the agent inserting
      a gratuitous KDF into a migration and calling it a requirement.

  - ruleId: SP800-227-4.4-001
    family: USAGE_CONSTRAINT
